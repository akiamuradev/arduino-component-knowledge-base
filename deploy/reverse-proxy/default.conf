resolver 127.0.0.11 valid=10s ipv6=off;

upstream ackb_backend {
    zone ackb_backend 64k;
    server backend:8000 resolve;
}

upstream ackb_frontend {
    zone ackb_frontend 64k;
    server frontend:8080 resolve;
}

upstream ackb_minio {
    zone ackb_minio 64k;
    server minio:9000 resolve;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 260m;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' blob:" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /health {
        proxy_pass http://ackb_backend/health;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /ready {
        proxy_pass http://ackb_backend/ready;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://ackb_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 30s;
    }

    location /media-storage/ {
        proxy_pass http://ackb_minio/;
        proxy_http_version 1.1;
        proxy_set_header Host minio:9000;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://ackb_frontend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
